[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telebot"
version = "0.1.0"
description = "Telegram notification bot & market brief"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "feedparser>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
