name: Daily Market Brief

on:
  schedule:
    # 매일 00:10 UTC = 한국시간 09:10 (KST, UTC+9)
    - cron: "10 0 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEF_COMMODITIES_SYMBOLS: ${{ secrets.BRIEF_COMMODITIES_SYMBOLS }}
          BRIEF_BLOGS_RSS_URL: ${{ secrets.BRIEF_BLOGS_RSS_URL }}
          BRIEF_BLOGS_EXTRA_LINKS: ${{ secrets.BRIEF_BLOGS_EXTRA_LINKS }}
        run: |
          python -m market_brief